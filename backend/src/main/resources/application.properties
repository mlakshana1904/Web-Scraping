server.port=${PORT:8080}
spring.application.name=webscrapex-backend

# Database Configuration (PostgreSQL primary with H2 fallback if PostgreSQL is not available)
spring.datasource.url=${DB_URL:jdbc:h2:mem:webscrapex;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (enabled for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson Settings
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload / response limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.webscrapex=DEBUG
logging.level.org.hibernate.SQL=WARN
